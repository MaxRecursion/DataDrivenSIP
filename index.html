<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Theme before paint. This runs ahead of the stylesheet the prerender inlines, so a reader
      who chose dark — or whose OS did — never sees the light page first. It is the string
      NO_FLASH_SCRIPT in src/lib/theme.ts, and theme.test.ts fails if the two differ.
    -->
    <script>
      (function(){try{var r=document.documentElement,c=JSON.parse(localStorage.getItem("sip-date-planner.theme.v1")||"{}"),p=c.palette,m=c.mode;r.dataset.palette=["marigold","indigo","sandstone","graphite"].indexOf(p)>-1?p:"marigold";r.dataset.theme=m==="light"||m==="dark"?m:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){}})();
    </script>
    <!-- The light palette's surface. The theme service rewrites it once the choice is known. -->
    <meta name="theme-color" content="#EEF0F4" />
    <meta
      name="description"
      content="Pick a SIP date for your mutual fund, with an honest read on how much the date matters."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>SIP Date Planner</title>
    <link
      rel="preload"
      href="/fonts/v1/cabinet-grotesk-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
