<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#EEF0F4" />
    <meta
      name="description"
      content="Pick a SIP date for your mutual fund, with an honest read on how much the date matters."
    />
    <title>SIP Date Planner</title>
    <script>
      /* Every fund page is prerendered with DEFAULT parameters, so a URL asking for others has
         the wrong date painted in it until React re-renders. Mark the page before first paint
         and let the stylesheet hide what could be wrong (PLAN.md 6.2). Defaults are omitted
         from the query string, so the presence of either key already means "not the default". */
      if (/[?&](salary|buffer)=/.test(location.search)) {
        document.documentElement.dataset.paramsPending = "1";
      }
    </script>
    <link
      rel="preload"
      href="/fonts/v1/cabinet-grotesk-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
